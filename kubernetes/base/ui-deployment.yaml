apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: retail-app
  labels:
    app: ui
    Project: karatu-2025-capstone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
        Project: karatu-2025-capstone
    spec:
      serviceAccountName: retail-app-sa
      containers:
        - name: ui
          image: public.ecr.aws/aws-containers/retail-store-sample-ui:0.0.1
          ports:
            - containerPort: 8080
          env:
            - name: ENDPOINTS_ORDERS
              value: "http://orders:8080"
            - name: ENDPOINTS_CARTS
              value: "http://carts:8080"
            - name: ENDPOINTS_CHECKOUT
              value: "http://checkout:8080"
            - name: ENDPOINTS_CATALOG
              value: "http://catalog:8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: retail-app
  labels:
    app: ui
    Project: karatu-2025-capstone
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
